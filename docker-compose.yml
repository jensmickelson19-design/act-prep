services:
  postgres:
    image: postgres:16-alpine
    container_name: act-prep-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: act
      POSTGRES_PASSWORD: act
      POSTGRES_DB: act_prep
    ports:
      - "5433:5432"
    volumes:
      - act-prep-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U act -d act_prep"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  act-prep-db-data:
